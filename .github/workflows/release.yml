name: Выпуск prerelease
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Проверенный полный SHA коммита main'
        required: true
permissions:
  contents: read
concurrency:
  group: release-v0.1.0a1
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Проверка коммита и версии
        env:
          EXPECTED_SHA: ${{ inputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          python -c 'import tomllib; assert tomllib.load(open("pyproject.toml", "rb"))["project"]["version"] == "0.1.0a1"'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev pytest -q
      - run: uv run --frozen --extra dev ruff check .
      - run: uv build
      - name: Проверка установки wheel вне checkout
        run: |
          python -m venv /tmp/detkit-wheel
          /tmp/detkit-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/detkit-wheel/bin/detkit list
          /tmp/detkit-wheel/bin/detkit bundle T1033 --output /tmp/detkit-smoke
      - name: Архив и SHA256
        run: |
          git archive --format=zip --prefix=detection-engineering-toolkit/ HEAD -o dist/detection-engineering-toolkit-0.1.0a1-source.zip
          cp RELEASE-NOTES.md dist/RELEASE-NOTES.md
          cd dist
          sha256sum *.whl *.tar.gz *.zip RELEASE-NOTES.md > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Публикация неизменяемого тега и prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.commit }}
        run: |
          gh release create v0.1.0a1 dist/* --target "$RELEASE_SHA" --title 'Detection Engineering Toolkit 0.1.0a1' --notes-file dist/RELEASE-NOTES.md --prerelease
          mkdir downloaded
          gh release download v0.1.0a1 --dir downloaded
          cd downloaded
          sha256sum --check SHA256SUMS
