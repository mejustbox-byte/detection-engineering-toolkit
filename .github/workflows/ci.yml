name: Проверки
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev pytest -q
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen detkit doctor
      - run: uv build
      - run: uv run --frozen detkit bundle T1033 --output output/smoke
      - run: uv run --frozen detkit verify-bundle output/smoke
      - name: Install wheel outside checkout
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, tempfile, venv
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          with tempfile.TemporaryDirectory() as directory:
              temp = pathlib.Path(directory)
              venv.EnvBuilder(with_pip=True).create(temp / 'venv')
              bindir = temp / 'venv' / ('Scripts' if os.name == 'nt' else 'bin')
              python = bindir / ('python.exe' if os.name == 'nt' else 'python')
              subprocess.run([str(python), '-m', 'pip', 'install', str(wheel)], check=True, cwd=temp)
              cli = [str(python), '-m', 'detection_toolkit.cli']
              subprocess.run(cli + ['doctor'], check=True, cwd=temp)
              subprocess.run(cli + ['bundle', 'T1033', '--output', str(temp / 'smoke')], check=True, cwd=temp)
              subprocess.run(cli + ['verify-bundle', str(temp / 'smoke')], check=True, cwd=temp)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: detkit-${{ matrix.os }}
          path: |
            dist/*
            output/smoke/*
