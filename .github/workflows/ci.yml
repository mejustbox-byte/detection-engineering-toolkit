name: Проверки
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev pytest -q
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen detkit doctor
      - run: uv build
      - run: uv run --frozen detkit bundle T1033 --output output/smoke
      - run: uv run --frozen detkit verify-bundle output/smoke
      - run: uv run --frozen python scripts/check_readiness_docs.py
      - run: uv run --frozen python scripts/check_lab_docs.py
      - name: Parse collector syntax without executing it
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/check_lab_parser.ps1
      - name: Install wheel outside checkout
        run: uv run --frozen python scripts/verify_readiness_install.py
      - uses: actions/upload-artifact@v7
        with:
          name: detkit-${{ matrix.os }}
          path: |
            dist/*
            output/smoke/*
