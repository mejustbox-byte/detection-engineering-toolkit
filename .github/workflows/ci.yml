name: Проверки
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Установка закреплённых зависимостей
        run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev pytest -q
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen detkit list
      - run: uv build
      - run: uv run --frozen detkit bundle T1033 --output output/smoke
      - uses: actions/upload-artifact@v7
        with:
          name: detkit-${{ matrix.os }}
          path: |
            dist/*
            output/smoke/*
