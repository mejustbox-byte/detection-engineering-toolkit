[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-engineering-toolkit"
version = "0.1.0a2"
readme = "README.md"
description = "Reproducible detection engineering: ATT&CK scenarios, Sigma, SIEM queries and Atomic test plans"
requires-python = ">=3.12"
dependencies = ["pysigma==1.5.1", "pysigma-backend-splunk==2.1.0", "pysigma-backend-microsoft365defender==0.3.2", "PyYAML==6.0.3"]

[project.scripts]
detkit = "detection_toolkit.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "build==1.6.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
detection_toolkit = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
